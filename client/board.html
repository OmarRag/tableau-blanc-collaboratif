<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau blanc</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="page-board">
    <canvas id="board"></canvas>

    <!-- Barre du haut : titre, présence, actions -->
    <header id="topbar">
      <a class="back" href="/" title="Mes boards">←</a>
      <input id="title" class="title-input" spellcheck="false" />
      <span id="connection" class="badge">connexion…</span>
      <span id="readonly" class="badge badge-warn" hidden>lecture seule</span>
      <div id="peers" class="peers"></div>
      <div class="spacer"></div>
      <button id="btn-undo" title="Annuler (Ctrl+Z)">↶</button>
      <button id="btn-redo" title="Rétablir (Ctrl+Y)">↷</button>
      <button id="btn-export">Exporter</button>
      <button id="btn-share">Partager</button>
    </header>

    <!-- Barre d'outils à gauche -->
    <aside id="toolbar">
      <button data-tool="select" title="Sélection / déplacement (V)">⬚</button>
      <button data-tool="pen" title="Main levée (P)">✎</button>
      <button data-tool="rect" title="Rectangle (R)">▭</button>
      <button data-tool="ellipse" title="Ellipse (E)">◯</button>
      <button data-tool="arrow" title="Flèche (A)">↗</button>
      <button data-tool="text" title="Texte (T)">T</button>
      <button data-tool="eraser" title="Gomme (G)">⌫</button>
      <hr />
      <div class="swatches" id="swatches"></div>
      <label class="width-label">
        <input id="stroke-width" type="range" min="1" max="24" value="3" />
      </label>
      <label class="fill-label">
        <input id="fill-toggle" type="checkbox" /> fond
      </label>
    </aside>

    <!-- Zoom -->
    <div id="zoombar">
      <button id="zoom-out">−</button>
      <button id="zoom-reset">100 %</button>
      <button id="zoom-in">+</button>
    </div>

    <!-- Menu Exporter -->
    <div id="export-menu" class="popover" hidden>
      <button id="export-png">Image PNG</button>
      <button id="export-json">Fichier JSON</button>
      <button id="import-json">Importer un JSON…</button>
      <input id="import-file" type="file" accept="application/json" hidden />
    </div>

    <!-- Fenêtre de partage -->
    <div id="share-modal" class="modal" hidden>
      <div class="modal-box">
        <h2>Partager ce board</h2>

        <label class="row">
          <input id="share-public" type="checkbox" />
          <span>Board public — n'importe qui avec l'adresse peut <b>regarder</b></span>
        </label>

        <h3>Lien de partage</h3>
        <div class="row">
          <select id="share-role">
            <option value="view">peut regarder</option>
            <option value="edit">peut dessiner</option>
          </select>
          <input id="share-link" readonly />
          <button id="share-copy">Copier</button>
          <button id="share-rotate" title="Invalide l'ancien lien">Régénérer</button>
        </div>

        <h3>Inviter par email</h3>
        <form id="invite-form" class="row">
          <input id="invite-email" type="email" placeholder="email@exemple.fr" required />
          <select id="invite-role">
            <option value="view">peut regarder</option>
            <option value="edit">peut dessiner</option>
          </select>
          <button type="submit">Inviter</button>
        </form>
        <ul id="member-list" class="member-list"></ul>

        <p id="share-error" class="error"></p>
        <button id="share-close" class="close">Fermer</button>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/src/pages/board.js"></script>
  </body>
</html>
